name: azure-oidc-login
on:
  push:
    branches: [main, feature/fic-mismatch-test]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign-in-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub OIDC token claims
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c[k] for k in ['iss','sub','aud','exp']},indent=2))" "$T"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read and tag the resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group show -n github-azure-oicd-practice-resource -o table
            az tag update --operation merge --tags last-deployed-by=github-actions \
              --resource-id $(az group show -n github-azure-oicd-practice-resource --query id -o tsv)
